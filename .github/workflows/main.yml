on:
  release:
    types: [published]

jobs:
  github-releases-to-discord:
    runs-on: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "catBot"
          avatar_url: "https://cdn.discordapp.com/attachments/1287848895954681947/1358850483275698236/Tang.png?ex=6a7f4b21&is=6a7df9a1&hm=96e4f3aba7b99f048a0368daa6d3e961103c9d26a65f07eb55f36aa00bd74633"
          content: "||@catBot users||"
          footer_title: "Changelog"
          reduce_headings: true
